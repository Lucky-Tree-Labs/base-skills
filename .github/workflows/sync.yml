name: Sync skills from createbases.com

# Never pushes to main. A skill is instructions that run with full permissions
# inside every installer's agent, so a change to one is approved by a person
# even when it comes from our own site.
#
# The organization does not let Actions open pull requests, so this pushes the
# change to a branch and opens an issue that links the diff. A maintainer opens
# the pull request from there.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/sync.sh
      - name: Push a branch and open an issue if the skills changed
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Skills changed at createbases.com
        run: |
          git add -A skills
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C sync/skills
          git commit -m "Sync skills from createbases.com"
          git push --force origin sync/skills
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --title "$TITLE" --body "The skills published at createbases.com/.well-known/skills/ differ from this repository. Review the diff and open a pull request: https://github.com/${{ github.repository }}/compare/main...sync/skills?expand=1

          These files run as instructions in every installer's agent, so read the diff before merging."
          fi
