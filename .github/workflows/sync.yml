name: Sync skills from createbases.com

# Opens a pull request, never pushes to main. A skill is instructions that run
# with full permissions inside every installer's agent, so a change to one is
# approved by a person even when it comes from our own site.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/sync.sh
      - name: Open a pull request if the skills changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A skills
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C sync/skills
          git commit -m "Sync skills from createbases.com"
          git push --force origin sync/skills
          gh pr view sync/skills --json state --jq .state 2>/dev/null | grep -q OPEN \
            || gh pr create --base main --head sync/skills \
                 --title "Sync skills from createbases.com" \
                 --body "The skills published at createbases.com/.well-known/skills/ changed. Review the diff before merging: these files run as instructions in every installer's agent."
